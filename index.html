<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercices de Rééducation du Langage</title>
    <style>
        :root {
            --primary: #4A90E2;
            --primary-hover: #357ABD;
            --success: #2ECC71;
            --error: #E74C3C;
            --bg: #F4F7F6;
            --card-bg: #FFFFFF;
            --text: #2C3E50;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        /* Menu de sélection */
        .menu-title {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: var(--text);
        }

        .menu-grid {
            display: grid;
            gap: 15px;
        }

        .btn-menu {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 18px 20px;
            font-size: 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn-menu:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        /* Nav & Headers */
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-weight: bold;
            color: #7f8c8d;
        }

        .btn-back {
            background: #E0E6ED;
            color: var(--text);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .instruction {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 25px;
        }

        /* Exercice 1 : Choix du mot */
        .sentence-box {
            font-size: 1.5rem;
            background: #EBF3FA;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 2px dashed var(--primary);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-opt {
            background: #F8FAFC;
            border: 2px solid #DCE4EC;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text);
            transition: all 0.2s;
        }

        .btn-opt:hover {
            border-color: var(--primary);
            background: #EBF3FA;
        }

        .btn-opt.correct {
            background-color: var(--success) !important;
            color: white !important;
            border-color: var(--success) !important;
        }

        .btn-opt.wrong {
            background-color: var(--error) !important;
            color: white !important;
            border-color: var(--error) !important;
        }

        /* Exercice 2 : Reconstruire la phrase */
        .drop-zone {
            min-height: 70px;
            background: #EBF3FA;
            border: 2px dashed var(--primary);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .word-chip {
            background: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        /* Exercice 3 : Image / Mot */
        .image-card {
            font-size: 5rem;
            margin-bottom: 15px;
            background: #F8FAFC;
            padding: 15px;
            border-radius: 15px;
            display: inline-block;
        }

        /* Boutons & Messages */
        .btn-action {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .feedback {
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 30px;
        }

        .feedback.success { color: var(--success); }
        .feedback.error { color: var(--error); }

        .hidden { display: none !important; }
    </style>
</head>

        ];

        let indexEx1 = 0, indexEx2 = 0, indexEx3 = 0;

        function showMenu() {
            document.getElementById('menu-screen').classList.remove('hidden');
            document.getElementById('ex1-screen').classList.add('hidden');
            document.getElementById('ex2-screen').classList.add('hidden');
            document.getElementById('ex3-screen').classList.add('hidden');
        }

        function startEx(num) {
            document.getElementById('menu-screen').classList.add('hidden');
            if (num === 1) { indexEx1 = 0; loadEx1(); document.getElementById('ex1-screen').classList.remove('hidden'); }
            if (num === 2) { indexEx2 = 0; loadEx2(); document.getElementById('ex2-screen').classList.remove('hidden'); }
            if (num === 3) { indexEx3 = 0; loadEx3(); document.getElementById('ex3-screen').classList.remove('hidden'); }
        }

        // --- EXERCICE 1 ---
        function loadEx1() {
            const data = ex1Data[indexEx1];
            document.getElementById('ex1-prog').textContent = indexEx1 + 1;
            document.getElementById('ex1-sentence').textContent = data.sentence;
            document.getElementById('ex1-feedback').textContent = '';
            document.getElementById('ex1-feedback').className = 'feedback';
            document.getElementById('ex1-next').classList.add('hidden');

            const grid = document.getElementById('ex1-options');
            grid.innerHTML = '';

            const shuffled = [...data.options].sort(() => 0.5 - Math.random());
            shuffled.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-opt';
                btn.textContent = opt;
                btn.onclick = () => {
                    const buttons = grid.querySelectorAll('.btn-opt');
                    buttons.forEach(b => b.disabled = true);
                    if (opt === data.answer) {
                        btn.classList.add('correct');
                        document.getElementById('ex1-feedback').textContent = 'Bravo ! 🎉';
                        document.getElementById('ex1-feedback').className = 'feedback success';
                    } else {
                        btn.classList.add('wrong');
                        document.getElementById('ex1-feedback').textContent = `La bonne réponse était : ${data.answer}`;
                        document.getElementById('ex1-feedback').className = 'feedback error';
                    }
                    document.getElementById('ex1-next').classList.remove('hidden');
                };
                grid.appendChild(btn);
            });
        }

        function nextEx1() {
            indexEx1 = (indexEx1 + 1) % ex1Data.length;
            loadEx1();
        }

        // --- EXERCICE 2 ---
        function loadEx2() {
            const data = ex2Data[indexEx2];
            document.getElementById('ex2-prog').textContent = indexEx2 + 1;
            document.getElementById('ex2-drop').innerHTML = '';
            document.getElementById('ex2-bank').innerHTML = '';
            document.getElementById('ex2-feedback').textContent = '';
            document.getElementById('ex2-next').classList.add('hidden');

            data.pool.forEach(word => {
                const chip = document.createElement('div');
                chip.className = 'word-chip';
                chip.textContent = word;
                chip.onclick = () => moveWord(chip);
                document.getElementById('ex2-bank').appendChild(chip);
            });
        }

        function moveWord(chip) {
            const dropZone = document.getElementById('ex2-drop');
            const bankZone = document.getElementById('ex2-bank');
            if (chip.parentElement === bankZone) {
                dropZone.appendChild(chip);
            } else {
                bankZone.appendChild(chip);
            }
        }

        function checkEx2() {
            const currentSentence = Array.from(document.getElementById('ex2-drop').children)
                .map(chip => chip.textContent);
            const targetSentence = ex2Data[indexEx2].target;

            const isCorrect = JSON.stringify(currentSentence) === JSON.stringify(targetSentence);
            const feedback = document.getElementById('ex2-feedback');

            if (isCorrect) {
                feedback.textContent = 'Parfait ! Très bonne phrase. 👏';
                feedback.className = 'feedback success';
                document.getElementById('ex2-next').classList.remove('hidden');
            } else {
                feedback.textContent = 'Les mots ne sont pas encore au bon endroit.';
                feedback.className = 'feedback error';
            }
        }

        function nextEx2() {
            indexEx2 = (indexEx2 + 1) % ex2Data.length;
            loadEx2();
        }

        // --- EXERCICE 3 ---
        function loadEx3() {
            const data = ex3Data[indexEx3];
            document.getElementById('ex3-prog').textContent = indexEx3 + 1;
            document.getElementById('ex3-image').textContent = data.icon;
            document.getElementById('ex3-feedback').textContent = '';
            document.getElementById('ex3-feedback').className = 'feedback';
            document.getElementById('ex3-next').classList.add('hidden');

            const grid = document.getElementById('ex3-options');
            grid.innerHTML = '';

            const shuffled = [...data.options].sort(() => 0.5 - Math.random());
            shuffled.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn-opt';
                btn.textContent = opt;
                btn.onclick = () => {
                    const buttons = grid.querySelectorAll('.btn-opt');
                    buttons.forEach(b => b.disabled = true);
                    if (opt === data.answer) {
                        btn.classList.add('correct');
                        document.getElementById('ex3-feedback').textContent = 'Excellente réponse ! ✨';
                        document.getElementById('ex3-feedback').className = 'feedback success';
                    } else {
                        btn.classList.add('wrong');
                        document.getElementById('ex3-feedback').textContent = `C'est : ${data.answer}`;
                        document.getElementById('ex3-feedback').className = 'feedback error';
                    }
                    document.getElementById('ex3-next').classList.remove('hidden');
                };
                grid.appendChild(btn);
            });
        }

        function nextEx3() {
            indexEx3 = (indexEx3 + 1) % ex3Data.length;
            loadEx3();
        }
